# O React Native ainda espera as dependencias na raiz de node_modules.
nodeLinker: hoisted

allowBuilds:
  "@firebase/util": false
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  esbuild: true
  protobufjs: false

overrides:
  # Transitiva do SDK JS do Firebase. Corrige a falha de getAuthContext sem mudar a major.
  "@grpc/grpc-js": ^1.13.6
  # O react-native-css le o CSS compilado por esta versao. Outra versao quebra o global.css.
  lightningcss: 1.30.1

# O react-native-css repassa os exports do RN por uma lista fixa, sem o AssetRegistry do RN 0.88: sem
# ele o expo-asset nao carrega fonte nem icone. Confira se ainda falta ao subir RN ou react-native-css
# (test/regressions/react-native-css-exports.test.ts acusa).
patchedDependencies:
  react-native-css@3.1.0-rc.0: patches/react-native-css@3.1.0-rc.0.patch
